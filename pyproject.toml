[project]
name = "web-edit"
version = "0.1"
description = "Web app for editing files in a folder"
readme = "README.md"
authors = [{name = "Simon Willison"}]
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = []
dependencies = [
    "click",
    "starlette>=0.47",
    "uvicorn>=0.30",
    "python-multipart>=0.0.20"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/simonw/web-edit"
Changelog = "https://github.com/simonw/web-edit/releases"
Issues = "https://github.com/simonw/web-edit/issues"
CI = "https://github.com/simonw/web-edit/actions"

[project.scripts]
web-edit = "web_edit.cli:cli"

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["web_edit*"]

[tool.setuptools.package-data]
web_edit = ["static/*"]
