name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: |
        pip install '.[test]'
    - name: Run tests
      run: |
        if [ -d tests ]; then python -m pytest; else echo "Tests directory not found"; fi

  wheel:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install uv
      run: pip install uv
    - name: Verify bundled frontend is current
      run: |
        npm ci
        npm run build
        git diff --exit-code -- web_edit/static
    - name: Build and test the wheel in isolation
      run: |
        uv build
        uv run scripts/check_wheel.py dist/web_edit-0.1-py3-none-any.whl
